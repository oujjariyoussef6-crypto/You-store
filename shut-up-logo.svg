<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Grunge texture pattern -->
    <filter id="grunge">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <!-- Rough edges filter -->
    <filter id="roughen">
      <feTurbulence baseFrequency="0.05" numOctaves="2" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="3"/>
    </filter>
    
    <!-- Shadow effect -->
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="4" dy="4" result="offsetblur"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background (transparent for t-shirt) -->
  <rect width="800" height="800" fill="none"/>
  
  <!-- Decorative skull elements (subtle, in background) -->
  <g opacity="0.15" transform="translate(100, 150)">
    <!-- Left skull -->
    <ellipse cx="50" cy="50" rx="40" ry="50" fill="#000"/>
    <ellipse cx="35" cy="40" rx="12" ry="15" fill="#fff"/>
    <ellipse cx="65" cy="40" rx="12" ry="15" fill="#fff"/>
    <path d="M 30 70 Q 50 85 70 70" stroke="#fff" stroke-width="3" fill="none"/>
  </g>
  
  <g opacity="0.15" transform="translate(650, 150)">
    <!-- Right skull -->
    <ellipse cx="50" cy="50" rx="40" ry="50" fill="#000"/>
    <ellipse cx="35" cy="40" rx="12" ry="15" fill="#fff"/>
    <ellipse cx="65" cy="40" rx="12" ry="15" fill="#fff"/>
    <path d="M 30 70 Q 50 85 70 70" stroke="#fff" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Flame elements (subtle, bottom) -->
  <g opacity="0.2" transform="translate(200, 600)">
    <path d="M 0 50 Q 10 20 20 0 Q 25 20 30 10 Q 35 30 40 0 Q 45 25 50 10 Q 55 35 60 0 Q 65 20 70 10 Q 75 25 80 0 Q 85 30 90 20 Q 95 40 100 50" 
          fill="#000" filter="url(#roughen)"/>
  </g>
  
  <g opacity="0.2" transform="translate(500, 600)">
    <path d="M 0 50 Q 10 20 20 0 Q 25 20 30 10 Q 35 30 40 0 Q 45 25 50 10 Q 55 35 60 0 Q 65 20 70 10 Q 75 25 80 0 Q 85 30 90 20 Q 95 40 100 50" 
          fill="#000" filter="url(#roughen)"/>
  </g>
  
  <!-- Distressed border frame -->
  <rect x="120" y="280" width="560" height="240" 
        fill="none" 
        stroke="#000" 
        stroke-width="4" 
        filter="url(#roughen)"/>
  
  <!-- Main text: SHUT UP -->
  <g filter="url(#shadow)">
    <!-- SHUT -->
    <text x="400" y="380" 
          font-family="Impact, Arial Black, sans-serif" 
          font-size="120" 
          font-weight="900" 
          text-anchor="middle" 
          fill="#000"
          letter-spacing="8"
          style="paint-order: stroke; stroke: #fff; stroke-width: 6px;">SHUT</text>
    
    <!-- UP -->
    <text x="400" y="480" 
          font-family="Impact, Arial Black, sans-serif" 
          font-size="120" 
          font-weight="900" 
          text-anchor="middle" 
          fill="#000"
          letter-spacing="8"
          style="paint-order: stroke; stroke: #fff; stroke-width: 6px;">UP</text>
  </g>
  
  <!-- Grunge overlay texture on text -->
  <g opacity="0.3" filter="url(#grunge)">
    <text x="400" y="380" 
          font-family="Impact, Arial Black, sans-serif" 
          font-size="120" 
          font-weight="900" 
          text-anchor="middle" 
          fill="#000"
          letter-spacing="8">SHUT</text>
    
    <text x="400" y="480" 
          font-family="Impact, Arial Black, sans-serif" 
          font-size="120" 
          font-weight="900" 
          text-anchor="middle" 
          fill="#000"
          letter-spacing="8">UP</text>
  </g>
  
  <!-- Decorative lines (top and bottom) -->
  <line x1="150" y1="300" x2="650" y2="300" stroke="#000" stroke-width="3" filter="url(#roughen)"/>
  <line x1="150" y1="500" x2="650" y2="500" stroke="#000" stroke-width="3" filter="url(#roughen)"/>
  
  <!-- Corner decorative elements -->
  <g transform="translate(140, 290)">
    <path d="M 0 0 L 20 0 L 20 2 L 2 2 L 2 20 L 0 20 Z" fill="#000"/>
  </g>
  <g transform="translate(660, 290)">
    <path d="M 0 0 L -20 0 L -20 2 L -2 2 L -2 20 L 0 20 Z" fill="#000"/>
  </g>
  <g transform="translate(140, 510)">
    <path d="M 0 0 L 20 0 L 20 -2 L 2 -2 L 2 -20 L 0 -20 Z" fill="#000"/>
  </g>
  <g transform="translate(660, 510)">
    <path d="M 0 0 L -20 0 L -20 -2 L -2 -2 L -2 -20 L 0 -20 Z" fill="#000"/>
  </g>
</svg>
